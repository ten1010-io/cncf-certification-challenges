name: Generate README
on:
  push:
    branches: [main]
    paths: ["*/questions/**/info.yml", "*/questions/**/README.md", "*/exams/*.yml", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        run: REPO="${{ github.repository }}" bash scripts/gen-readme.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "docs: regenerate README [skip ci]"
          git push
