name: Generate README
on:
  push:
    branches: [main]
    paths: ["*/questions/**/info.yml", "*/questions/**/README.md", "*/exams/*.yml", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readme-${{ github.ref }}
  cancel-in-progress: false
jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        run: REPO="${{ github.repository }}" bash scripts/gen-readme.sh
      - name: Commit and push (retry on race)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "docs: regenerate README [skip ci]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 거부됨(경합). rebase 후 재시도 $i/3"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            REPO="${{ github.repository }}" bash scripts/gen-readme.sh
            git add -A
            git diff --cached --quiet || git commit --amend --no-edit
          done
          echo "::error::3회 재시도 후에도 push 실패"
          exit 1
