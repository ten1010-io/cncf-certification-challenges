# '새 문제 제안' 이슈 → 폼 검증만 수행하고 결과를 코멘트한다.
# 실제 폴더 생성·브랜치·PR 은 메인테이너가 로컬에서 `q issue take <이슈번호>` 로 만든다.
# (조직 정책상 Actions 에 PR 생성 권한이 없어도 동작하게 하기 위한 구조)
name: Validate New Question
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  issues: write
concurrency:
  group: validate-question-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'new-question')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate issue form
        id: gen
        run: |
          set +e
          out=$(python3 scripts/issue-to-question.py "$GITHUB_EVENT_PATH" --dry-run 2>/tmp/err); rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            { echo "errors<<XEOFX"; cat /tmp/err; echo "XEOFX"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "$out" >> "$GITHUB_OUTPUT"

      - name: Comment result
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.gen.outputs.ok }}
          ERRORS: ${{ steps.gen.outputs.errors }}
          QID: ${{ steps.gen.outputs.id }}
          QDIR: ${{ steps.gen.outputs.dir }}
          QCERT: ${{ steps.gen.outputs.cert }}
        with:
          script: |
            const { OK, ERRORS, QID, QDIR, QCERT } = process.env;
            const n = context.issue.number;
            const add = (labels) => github.rest.issues.addLabels({ ...context.repo, issue_number: n, labels });
            const drop = async (name) => { try { await github.rest.issues.removeLabel({ ...context.repo, issue_number: n, name }); } catch (e) {} };
            let body;
            if (OK === 'true') {
              body = [
                `### ✅ 폼 검증 통과`,
                ``,
                `머지되면 \`${QDIR}\` 로 추가된다 (번호 **${QID}**, 자격증 \`${QCERT}\`). 번호는 머지 시점에 다시 계산된다.`,
                ``,
                `**메인테이너**: 로컬에서 아래를 실행하면 브랜치·커밋·PR 이 만들어진다.`,
                ``,
                '```bash',
                `q issue take ${n}`,
                '```',
                ``,
                `내용을 고치려면 이슈 본문을 수정하면 된다. 저장할 때마다 다시 검증한다.`,
              ].join('\n');
              await drop('invalid');
              if (QCERT) { try { await add([QCERT]); } catch (e) {} }
            } else {
              body = `### ❌ 폼 검증 실패\n\n${ERRORS}\n\n이슈 본문을 **수정(Edit)** 하면 자동으로 다시 검증한다.`;
              await add(['invalid']);
            }
            await github.rest.issues.createComment({ ...context.repo, issue_number: n, body });
