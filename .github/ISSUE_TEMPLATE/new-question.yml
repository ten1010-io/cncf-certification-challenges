name: 새 문제 제안 (New Question)
description: 폼을 채우면 봇이 문제 폴더를 생성해 PR 을 올린다. 메인테이너가 이슈에 approved 라벨을 달면 자동 머지된다.
title: "[New Question] "
labels: ["new-question"]
body:
  - type: markdown
    attributes:
      value: |
        스크립트 필드에는 **본문만** 쓴다. `#!/usr/bin/env bash`, `source lib.sh`, `q_init`, `q_start`/`q_end` 는 봇이 붙인다.
        사용 가능한 함수는 [CONTRIBUTING](../blob/main/CONTRIBUTING.md) 의 "스크립트 규약" 참고. 예시는 아무 문제 폴더나 열어보면 된다.
  - type: dropdown
    id: cert
    attributes:
      label: 자격증
      options: [cka, ckad, cks]
    validations: { required: true }
  - type: input
    id: domain
    attributes:
      label: 도메인
      description: "cka: troubleshooting | cluster | networking | workloads | storage — ckad: environment | design | deployment | networking | observability"
      placeholder: troubleshooting
    validations: { required: true }
  - type: dropdown
    id: difficulty
    attributes:
      label: 난이도
      options: [easy, medium, hard]
    validations: { required: true }
  - type: input
    id: title
    attributes:
      label: 제목
      description: 짧게. README 헤더와 목록 뱃지에 쓰인다.
      placeholder: 노드 NotReady 복구 (kubelet 정지)
    validations: { required: true }
  - type: input
    id: slug
    attributes:
      label: slug
      description: 폴더 이름용. 영문 소문자·숫자·하이픈만.
      placeholder: node-notready-kubelet-stopped
    validations: { required: true }
  - type: input
    id: points
    attributes:
      label: 배점
      description: 모의고사 기준 %. 보통 4~8.
      placeholder: "6"
    validations: { required: true }
  - type: input
    id: tags
    attributes:
      label: 태그
      description: 쉼표 구분.
      placeholder: node, kubelet, systemd
  - type: dropdown
    id: node_access
    attributes:
      label: 노드 접근 필요 (docker exec)
      options: ["false", "true"]
      default: 0
    validations: { required: true }
  - type: dropdown
    id: disruptive
    attributes:
      label: 다른 문항 환경을 깨뜨리는가 (스케줄러·kubelet·DNS 정지 등)
      options: ["false", "true"]
      default: 0
    validations: { required: true }
  - type: textarea
    id: question
    attributes:
      label: 지문
      description: 시험처럼 건조하게. 리소스 이름·네임스페이스·경로·조건 명시. 결과 파일은 /tmp/cncf-out/ 아래.
      placeholder: |
        네임스페이스 `foo` 에 Deployment `web` 을 생성한다.

        - 이미지 `nginx:1.25`, replicas 3
    validations: { required: true }
  - type: textarea
    id: setup
    attributes:
      label: setup.sh 본문
      description: 환경 구성. 멱등. 자기 리소스만.
      render: bash
      placeholder: |
        ns_ensure foo
        $K -n foo create deploy broken --image=ngnix:1.25 --dry-run=client -o yaml | $K apply -f - >/dev/null
    validations: { required: true }
  - type: textarea
    id: check
    attributes:
      label: check.sh 본문
      description: expect / expect_eq / expect_contains ... 줄들. q_start/q_end 는 봇이 붙인다.
      render: bash
      placeholder: |
        expect_eq "readyReplicas 3" "3" "$(jp foo deploy/web '{.status.readyReplicas}')"
        expect_contains "이미지" "nginx:1.25" "$(jp foo deploy/web '{.spec.template.spec.containers[0].image}')"
    validations: { required: true }
  - type: textarea
    id: cleanup
    attributes:
      label: cleanup.sh 본문
      render: bash
      placeholder: |
        ns_delete foo
    validations: { required: true }
  - type: textarea
    id: solution
    attributes:
      label: 풀이
      description: 명령·YAML + "## 함정" 2~4개.
      placeholder: |
        ```bash
        k -n foo create deploy web --image=nginx:1.25 --replicas=3
        ```

        ## 함정

        - ...
    validations: { required: true }
